<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Padel Arena Manager v11</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#04101a,#08243b 72%,#06131f);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{max-width:680px;margin:auto;padding:14px 14px 92px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:64px;height:64px;border-radius:18px;object-fit:cover}.brand b{font-size:21px}.ver{color:#9bec37;font-weight:900}
.card,.tile{background:#0b2235;border:1px solid #1d4a69;border-radius:20px;padding:15px;margin-top:10px}.muted{color:#9db4c5}.tiny{font-size:12px}h2{font-size:20px;margin:22px 3px 10px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn,.primary,.danger{border-radius:12px;padding:10px 12px;font-weight:800}.btn{background:#12344e;color:#fff;border:1px solid #2d5c7c}.primary{background:#9bec37;color:#092409;border:0}.danger{background:#4a1d24;color:#ffd5d8;border:1px solid #74333b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{text-align:left;color:#fff;min-height:118px}.tile strong{display:block;font-size:16px;margin:8px 0 4px}.ico{font-size:25px}
.clubrow{display:flex;gap:11px;align-items:center;padding:11px 0;border-top:1px solid #173950}.clubrow img,.clubLogo{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:14px;padding:4px}.clubrow>div{flex:1}
label{display:block;color:#9db4c5;font-size:12px;margin:10px 0 5px}input,select{width:100%;background:#071a29;color:#fff;border:1px solid #2b5877;border-radius:12px;padding:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.authbox{width:min(540px,100%);background:#0b2235;border:1px solid #1d4a69;border-radius:24px;padding:18px;box-shadow:0 20px 50px #0008}.authTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.authTabs button.active{outline:2px solid #9bec37}
.actions{display:flex;gap:8px;margin-top:10px}.actions>*{flex:1}.notice{border-left:4px solid #f1b84b}.ok{border-left:4px solid #64d28c}.bad{border-left:4px solid #df6672}.rolebadge{display:inline-block;padding:5px 8px;border-radius:999px;background:#143750;color:#bfe6ff;font-size:12px;font-weight:800}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#061522f2;border-top:1px solid #21445e;padding:9px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.bottom button{background:none;border:0;color:#b0c2ce;font-size:11px}
.list{display:grid;gap:9px}.list .card{display:flex;justify-content:space-between;gap:10px;align-items:center}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{font-size:24px;font-weight:900}.previewbar{display:flex;gap:8px;overflow:auto;margin:10px 0}.previewbar button{white-space:nowrap}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:8px}
@media(max-width:520px){.row{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="authView" class="auth">
  <div class="authbox">
    <div class="brand"><img src="assets/pam.jpeg"><div><b>PADEL ARENA<br>MANAGER</b><div class="ver">v11</div></div></div>
    <h2>Accedi</h2>
    <div class="muted">Un unico account per accedere ai circoli presenti nella piattaforma.</div>
    <div class="authTabs"><button id="loginTab" class="btn active">Accedi</button><button id="registerTab" class="btn">Registrati</button></div>
    <form id="loginForm">
      <label>Email</label><input id="loginEmail" type="email" required autocomplete="email">
      <label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password">
      <button class="primary" style="width:100%;margin-top:12px">Entra</button>
      <button id="resetPasswordBtn" type="button" class="btn" style="width:100%;margin-top:8px">Password dimenticata</button>
    </form>
    <form id="registerForm" class="hidden">
      <div class="row"><div><label>Nome *</label><input id="regFirstName" required></div><div><label>Cognome *</label><input id="regLastName" required></div></div>
      <div class="row"><div><label>Data di nascita *</label><input id="regBirthDate" type="date" required></div><div><label>Luogo di nascita *</label><input id="regBirthPlace" required></div></div>
      <div class="row"><div><label>Comune di residenza *</label><input id="regResidence" required></div><div><label>CAP *</label><input id="regCap" required inputmode="numeric"></div></div>
      <div class="row"><div><label>Provincia *</label><input id="regProvince" required maxlength="2"></div><div><label>Telefono *</label><input id="regPhone" required inputmode="tel"></div></div>
      <label>Email *</label><input id="regEmail" type="email" required>
      <label>Password *</label><input id="regPassword" type="password" minlength="6" required>
      <label>Livello *</label><select id="regLevel"><option>Principiante base</option><option>Principiante avanzato</option><option>Medio base</option><option>Intermedio</option><option>Intermedio avanzato</option><option>Avanzato</option></select>
      <div class="muted tiny" style="margin-top:8px">Il livello iniziale sarà indicato come auto dichiarato. Un istruttore potrà certificarlo successivamente.</div>
      <button class="primary" style="width:100%;margin-top:12px">Crea account cliente</button>
    </form>
    <div id="authMsg" class="muted tiny" style="margin-top:10px"></div>
  </div>
</div>
<div id="appView" class="app hidden">
  <div class="top"><div class="brand"><img src="assets/pam.jpeg"><div><b>PADEL ARENA<br>MANAGER</b><div class="ver">v11</div></div></div><div style="text-align:right"><span id="roleBadge" class="rolebadge"></span><div id="userName" class="tiny muted" style="margin-top:5px"></div></div></div>
  <div id="adminPreviewBar" class="previewbar hidden"></div>
  <main id="main"></main>
</div>
<nav id="bottomNav" class="bottom hidden"><button data-nav="home">🏠<br>Home</button><button data-nav="activities">📅<br>Attività</button><button data-nav="profile">👤<br>Profilo</button><button id="logoutBtn">🚪<br>Esci</button></nav>
<script type="module" src="app.js"></script>
</body></html>
